# /etc/nginx/conf.d/patv-hls-auth-upstreams.conf  (PATV 1.99gk, deploy/hls-auth/) - http{} context.
# The sites that answer nginx's auth_request for RTMP-slot HLS (snippets/patv-hls.conf -> GET /api/stage/hls-auth).
# Kept-alive connections so a per-segment check is one small request on an open socket. max_fails=0: a site
# restart never parks the upstream as "down" for fail_timeout. keepalive_timeout 4s < Node's 5 s keepAliveTimeout,
# so nginx never reuses a socket Node is about to close.
upstream patv_hls_auth_prod {
    server 127.0.0.1:3000 max_fails=0;
    keepalive 16;
    keepalive_timeout 4s;
}
upstream patv_hls_auth_staging {
    server 127.0.0.1:3100 max_fails=0;
    keepalive 4;
    keepalive_timeout 4s;
}
