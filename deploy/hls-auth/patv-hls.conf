# /etc/nginx/snippets/patv-hls.conf  (PATV 1.99gk, deploy/hls-auth/) - included in the publicaccess.tv server
# block (sites-available/default) IN PLACE OF the old `location /hls { root /mnt/; ... }` (install.sh swaps them).
#
# nginx-rtmp writes HLS to /mnt/hls (prod "live": Pepe's "broadcast" + slots "stage-<16 hex>") and /mnt/hls/staging
# (staging "live_staging": slots "stg-<16 hex>"). Slot streams on an Approved pad are members-only (padaccess.js),
# so every slot playlist / segment asks the owning site first (hlsauth.js):
#   /hls/broadcast.m3u8, /hls/broadcast-N.ts   Pepe's stream: its OWN location, never asks - works with the site down
#   /hls/staging/...stg-<hex>...                auth_request -> staging (127.0.0.1:3100)
#   /hls/...stage-<hex>...                      auth_request -> prod (127.0.0.1:3000)
#   any other /hls file                         served as before (no auth)
# The site answers 200 / 403; site down / a 5xx -> nginx answers 500 = slot streams fail CLOSED (broadcast unaffected).
# Regex locations are tried in order and win over the plain prefix `location /hls`, so the order below matters.

# Pepe's main stream - first, and no auth_request
location ~ "^/hls/broadcast(?:\.m3u8|-[0-9]+\.ts)$" {
    root /mnt/;
    add_header 'Cache-Control' no-cache;
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length';
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }
}

# BEGIN staging-gate
location ~ "^/hls/staging/.*(?:stage|stg)-[0-9a-f]{16}" {
    auth_request /_hls_auth_staging;
    root /mnt/;
    add_header 'Cache-Control' no-cache;
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length';
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }
}
# END staging-gate

# BEGIN prod-gate
location ~ "^/hls/.*(?:stage|stg)-[0-9a-f]{16}" {
    auth_request /_hls_auth;
    root /mnt/;
    add_header 'Cache-Control' no-cache;
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length';
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }
}
# END prod-gate

# the auth subrequests: internal only (a browser asking /_hls_auth gets 404). No body; the viewer's URI, real IP
# ($remote_addr after the Cloudflare realip config) and cookies; the proxy headers are REMOVED - the site only answers
# requests without them, so the same route through the public proxy (location / -> :3000) is always refused.
location = /_hls_auth {
    internal;
    proxy_pass http://patv_hls_auth_prod/api/stage/hls-auth;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host publicaccess.tv;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-HLS-Client-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header CF-Connecting-IP "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;
}
location = /_hls_auth_staging {
    internal;
    proxy_pass http://patv_hls_auth_staging/api/stage/hls-auth;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host staging.publicaccess.tv;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-HLS-Client-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header CF-Connecting-IP "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;
}

# everything else under /hls - exactly the old block
location /hls {
    root /mnt/;
    add_header 'Cache-Control' no-cache;
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length';
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }
}
