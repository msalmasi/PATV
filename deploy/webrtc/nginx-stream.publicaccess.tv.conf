# /etc/nginx/sites-available/stream.publicaccess.tv  (PATV 1.99et, from deploy/webrtc/) - symlinked into
# sites-enabled by install.sh. WHIP / WHEP / HLS for the stages' WebRTC, proxied to MediaMTX on loopback.
# Its own file, so backing it out is: rm /etc/nginx/sites-enabled/stream.publicaccess.tv && nginx -t &&
# systemctl reload nginx   (rollback.sh does exactly that).
# Untouched: the RTMP ingest rtmp://stream.publicaccess.tv/... (the rtmp{} block in nginx.conf) and every
# other server block. stream.publicaccess.tv is DNS-only (not Cloudflare-proxied): ICE / TURN need the
# real IP, so this block talks to browsers directly.
#
#   POST /whip/<stream>                  -> MediaMTX /<stream>/whip   (publish; Authorization: Bearer)
#   POST /whep/<stream>                  -> MediaMTX /<stream>/whep   (play)
#   PATCH|DELETE /<stream>/whip|whep/<session>   the session resource MediaMTX returns in Location
#   GET  /<stream>/index.m3u8 (+ parts)  -> MediaMTX HLS
#   <stream> = a stage slot stream name: stage-<16 hex> (prod) / stg-<16 hex> (staging), or Pepe's main stream
#   "pepe" (1.99fi - his OBS publishes WHIP there; MediaMTX's auth hook decides), or a pad's room audio
#   room-<16 hex> (prod) / stgr-<16 hex> (staging) - 1.99il, roomrtc.js: WHIP from Pepe, WHEP only (no HLS location).
#   Nothing else.

server {
    server_name stream.publicaccess.tv;
    client_max_body_size 64k;   # SDP offers are a few KB
    add_header X-Robots-Tag "noindex, nofollow" always;

    # WHIP / WHEP, the documented spelling: /whip/<stream> -> /<stream>/whip
    location ~ "^/(whip|whep)/((?:stage|stg|room|stgr)-[0-9a-f]{16}|pepe)$" {
        rewrite ^/(whip|whep)/(.+)$ /$2/$1 break;
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/patv-proxy-headers.conf;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # MediaMTX's own spelling, and the session resources (PATCH trickle ICE / DELETE on stop)
    location ~ "^/(?:(?:stage|stg|room|stgr)-[0-9a-f]{16}|pepe)/(?:whip|whep)(?:/[0-9a-f-]{36})?$" {
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/patv-proxy-headers.conf;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # HLS of WHIP streams (the default player and the ⚡ fallback)
    location ~ "^/(?:(?:stage|stg)-[0-9a-f]{16}|pepe)/" {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/patv-proxy-headers.conf;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/stream.publicaccess.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.publicaccess.tv/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name stream.publicaccess.tv;

    # certbot --webroot renewals (the cert was issued the same way, through the default server's root)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
