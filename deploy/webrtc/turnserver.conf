# PATV coturn (1.99et) - TURN for the stages' WebRTC (webrtc.js /api/turn). TEMPLATE - no secrets here.
# install.sh renders it to /etc/patv-turn/turnserver.conf (root:turnserver 0640) and fills:
#   @PUBLIC_IP@     the VPS's public IPv4 (listen + relay only there - never the docker bridges)
#   @TURN_HOST@     stream.publicaccess.tv (the name the browsers use; its Let's Encrypt cert)
#   @TURN_SECRET@   the shared secret from /etc/patv-webrtc/turn_secret (root 0600), also TURN_SECRET in
#                   both sites' .env. Rendered without ever being on a command line.
# coturn 4.5.1 (Ubuntu 20.04). Run by patv-turn.service; the packaged coturn.service stays masked.
# NOTE: coturn does not strip trailing comments - every comment here is on its own line.

# ---- listeners ----
listening-ip=@PUBLIC_IP@
relay-ip=@PUBLIC_IP@
listening-port=3478
tls-listening-port=5349
# relay range 49160-49200/udp = 41 ports = at most ~40 relayed sessions at once
min-port=49160
max-port=49200
server-name=@TURN_HOST@
realm=@TURN_HOST@

# ---- auth: TURN REST API (short-lived HMAC credentials from the site; username "<expiry>:<userId>") ----
fingerprint
use-auth-secret
static-auth-secret=@TURN_SECRET@
stale-nonce=600

# ---- TLS (turns:@TURN_HOST@:5349): a copy of the LE cert, kept readable for turnserver by the renewal hook ----
cert=/etc/patv-turn/certs/fullchain.pem
pkey=/etc/patv-turn/certs/privkey.pem
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
no-tlsv1
no-tlsv1_1

# ---- hardening ----
# no telnet admin console
no-cli
no-multicast-peers
# WebRTC only needs UDP relays: no RFC 6062 TCP connections to arbitrary peers
no-tcp-relay
# Never relay to private, loopback, link-local, CGNAT, documentation, multicast or reserved space (SSRF guard).
# The box's own public IP stays allowed: that's how a relayed viewer reaches MediaMTX (UDP 8189).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ---- quotas ----
# allocations per TURN username (one viewer / streamer, a few tabs)
user-quota=6
# allocations on the whole server (the relay range is 41 ports)
total-quota=40
# per session, bytes/s (~10 Mbit/s: a 6 Mbit/s stream + headroom)
max-bps=1250000
# whole server, bytes/s (~200 Mbit/s)
bps-capacity=25000000

# ---- logs: journald via stdout, no log files ----
log-file=stdout
pidfile=/run/patv-turn/turnserver.pid
